<!DOCTYPE html>
<html lang="pl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czarne Historie AI</title>
    <!-- Bootstrap 5.3 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <!-- 1. SPLASH SCREEN -->
    <section id="tab-splash" class="app-tab active d-flex flex-column justify-content-center align-items-center vh-100">
        <div class="text-center">
            <i class="bi bi-incognito display-1 text-danger mb-3 d-block pulse-icon"></i>
            <h1 class="fw-bold tracking-wide">STADO NA TROPIE</h1>
            <p class="text-secondary small">Mistrz Gry AI • Wczytywanie akt...</p>
            <div class="spinner-border text-danger spinner-border-sm mt-2" role="status"></div>
        </div>
    </section>

    <!-- 2. LOGOWANIE (WYBÓR PROFILU + PROSTE HASŁO) -->
    <section id="tab-login" class="app-tab container py-5">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-8 col-md-5 col-lg-4">
                <div class="card border-secondary shadow-lg">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-incognito fs-1 text-danger"></i>
                            <h2 class="h4 fw-bold mt-2">Zidentyfikuj się</h2>
                            <p class="text-secondary small mb-0">Wybierz swoje konto detektywa</p>
                        </div>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="login-username" class="form-label small text-secondary">Gracz</label>
                                <select id="login-username" class="form-select form-select-lg" required>
                                    <option value="" disabled selected>Ładowanie listy graczy...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="login-password" class="form-label small text-secondary">Hasło</label>
                                <input type="password" id="login-password" class="form-control form-control-lg" placeholder="Twoje imię małymi literami" required>
                            </div>
                            <div id="login-error" class="alert alert-danger py-2 small d-none"></div>
                            <button type="submit" class="btn btn-danger btn-lg w-100 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Wejdź do gry
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 3. DASHBOARD (PULPIT Z LISTĄ HISTORII) -->
    <section id="tab-dashboard" class="app-tab">
        <nav class="navbar navbar-dark bg-black border-bottom border-secondary sticky-top px-3">
            <div class="container-fluid px-0">
                <span class="navbar-brand fw-bold d-flex align-items-center gap-2 mb-0">
                    <i class="bi bi-incognito text-danger"></i> Czarne Historie
                </span>
                <div class="d-flex align-items-center gap-2">
                    <span id="current-user-badge" class="badge rounded-pill px-3 py-2">Gracz</span>
                    <button id="btn-logout" class="btn btn-outline-secondary btn-sm" title="Zmień użytkownika">
                        <i class="bi bi-person-gear"></i>
                    </button>
                </div>
            </div>
        </nav>

        <main class="container py-4" style="max-width: 760px;">
            <!-- Przycisk nowej zagadki + odświeżanie -->
            <div class="d-flex gap-2 mb-4">
                <button class="btn btn-danger flex-grow-1 py-2 fw-semibold shadow-sm" data-bs-toggle="modal" data-bs-target="#newStoryModal">
                    <i class="bi bi-plus-circle me-2"></i>Utwórz nową historię
                </button>
                <button id="btn-refresh-stories" class="btn btn-outline-secondary px-3" title="Odśwież listę">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>

            <!-- Zakładki: Aktywne vs Zakończone dla mnie -->
            <ul class="nav nav-pills nav-fill mb-3 bg-black p-1 rounded border border-secondary" id="stories-filter-pills">
                <li class="nav-item">
                    <button class="nav-link active py-1" data-filter="active">
                        <i class="bi bi-search me-1"></i>W toku (<span id="count-active">0</span>)
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link py-1" data-filter="completed">
                        <i class="bi bi-check2-circle me-1"></i>Zamknięte przeze mnie (<span id="count-completed">0</span>)
                    </button>
                </li>
            </ul>

            <!-- Lista kart historii -->
            <div id="stories-list" class="d-flex flex-column gap-3">
                <div class="text-center text-secondary py-5">Ładowanie akt spraw...</div>
            </div>
        </main>
    </section>

    <!-- 4. WIDOK ŚLEDZTWA (ROZGRYWKA) -->
    <section id="tab-story" class="app-tab">
        <nav class="navbar navbar-dark bg-black border-bottom border-secondary sticky-top px-3">
            <div class="container-fluid px-0">
                <button id="btn-back-dashboard" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Sprawy
                </button>
                <div class="d-flex align-items-center gap-2">
                    <button id="btn-sync-story" class="btn btn-outline-info btn-sm" title="Pobierz nowe pytania innych graczy">
                        <i class="bi bi-arrow-repeat me-1"></i>Synchronizuj
                    </button>
                    <button id="btn-toggle-complete" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-check-lg me-1"></i>Zakończ (dla mnie)
                    </button>
                </div>
            </div>
        </nav>

        <main class="container py-3 pb-5" style="max-width: 760px;">
            <!-- Karta główna zagadki / Akt sprawy -->
            <div class="card border-danger-subtle bg-black shadow mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <span id="story-mode-badge" class="badge bg-danger">Czarna Historia</span>
                            <span id="story-meta-date" class="text-secondary small"></span>
                        </div>
                        <div id="story-solvers-banner" class="small"></div>
                    </div>
                    <h2 id="story-title" class="h5 fw-bold text-light mb-2">Tytuł sprawy</h2>
                    <div id="story-intro" class="mb-0 text-light-emphasis story-intro-text">Opis zagadki...</div>
                </div>
            </div>

            <!-- Pasek informacji o aktywnej gałęzi (widoczny tylko w trybie Czarna Historia) -->
            <div id="branch-indicator" class="alert alert-secondary py-2 px-3 small d-flex justify-content-between align-items-center mb-3">
                <span>
                    <i class="bi bi-git me-1"></i>Kontynuujesz wątek: <strong id="branch-label">Główna linia śledztwa</strong>
                </span>
                <button id="btn-reset-branch" class="btn btn-link btn-sm p-0 text-decoration-none d-none">Wróć na koniec</button>
            </div>

            <!-- Oś czasu pytań i odpowiedzi (wszystkie karty domyślnie zwinięte) -->
            <div id="nodes-timeline" class="d-flex flex-column gap-2 mb-4">
                <!-- Węzły renderowane przez JS -->
            </div>

            <!-- Formularz zadawania pytania / ruchu w śledztwie -->
            <div class="card border-secondary shadow-sm mt-4" id="ask-panel">
                <div class="card-body">
                    <label id="question-input-label" for="question-input" class="form-label small fw-semibold text-secondary">
                        Zadaj pytanie Mistrzowi Gry (najlepiej tak/nie lub o szczegóły zbrodni):
                    </label>
                    <textarea id="question-input" class="form-control mb-3" rows="2" placeholder="Np. Czy ofiara znała sprawcę przed dniem zdarzenia?"></textarea>

                    <button id="btn-send-question" class="btn btn-danger w-100 fw-semibold">
                        <i class="bi bi-send me-2"></i>Zapytaj Mistrza Gry AI
                    </button>
                </div>
            </div>
        </main>
    </section>

    <!-- MODAL TWORZENIA NOWEJ HISTORII (WYBÓR TRYBU DWOMA PRZYCISKAMI) -->
    <div class="modal fade" id="newStoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold"><i class="bi bi-magic text-danger me-2"></i>Nowa sprawa dla ekipy</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label small fw-semibold text-secondary mb-2">1. Wybierz rodzaj rozgrywki:</label>
                    <div class="row g-2 mb-3" id="game-mode-selector">
                        <div class="col-6">
                            <button type="button" class="btn mode-choice-btn active w-100 h-100 p-3 text-start" data-mode="black_story">
                                <div class="fs-5 mb-1">🕵️ Czarna Historia</div>
                                <div class="small text-secondary lh-sm">Krótka, abstrakcyjna lub przewrotna zagadka. Pytania typu Tak / Nie.</div>
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn mode-choice-btn w-100 h-100 p-3 text-start" data-mode="crime_investigation">
                                <div class="fs-5 mb-1">🗂️ Śledztwo Kryminalne</div>
                                <div class="small text-secondary lh-sm">Rozbudowane akta, świadkowie, przesłuchania, dialogi i poszlaki.</div>
                            </button>
                        </div>
                    </div>

                    <label for="story-theme-input" class="form-label small fw-semibold text-secondary">
                        2. Opcjonalny motyw / elementy fabuły (zostaw puste dla losowego):
                    </label>
                    <input type="text" id="story-theme-input" class="form-control" placeholder="Np. stary pensjonat w Bieszczadach, zaginiony testament, burza...">
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button>
                    <button type="button" id="btn-confirm-create-story" class="btn btn-danger fw-semibold">
                        <i class="bi bi-stars me-1"></i>Generuj sprawę
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
</body>
</html>
